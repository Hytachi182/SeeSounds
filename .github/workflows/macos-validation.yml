name: macOS release validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: bash -n install_mac.sh run_mac.sh
      - name: Clean installation, source launch, offline relaunch and repair
        run: python scripts/verify_mac_launchers.py
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build native app bundle
        run: python -m PyInstaller --noconfirm sound_recognition_trainer.spec
      - name: Launch relocated bundle with real MP3 decoding
        run: |
          set -euo pipefail
          mkdir -p build/mac-validation
          APP_DIR="$(mktemp -d)/App with spaces"
          mkdir -p "$APP_DIR"
          ditto dist/SoundRecognitionTrainer.app "$APP_DIR/SoundRecognitionTrainer.app"
          AUDIO="$PWD/tests/fixtures/tone.mp3"
          REPORT="$PWD/build/mac-validation/packaged.json"
          VERIFY="$PWD/scripts/verify_packaged_launch.py"
          EXECUTABLE="$APP_DIR/SoundRecognitionTrainer.app/Contents/MacOS/SoundRecognitionTrainer"
          cd "$APP_DIR"
          env -u QT_QPA_PLATFORM python "$VERIFY" "$EXECUTABLE" --audio "$AUDIO" --report "$REPORT"
          /usr/bin/plutil -lint SoundRecognitionTrainer.app/Contents/Info.plist
          /usr/bin/codesign --verify --deep --strict SoundRecognitionTrainer.app
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-validation-${{ matrix.os }}
          path: build/mac-validation/
          if-no-files-found: error
